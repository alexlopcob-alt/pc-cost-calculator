<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pressure Calibration — Cost Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e1014;
    --surface:   #14171d;
    --surface2:  #1c2028;
    --line:      rgba(255,255,255,.07);
    --ink:       #f0f2f5;
    --mut:       #6b7585;
    --dim:       #3d4452;
    --red:       #d8503a;
    --red-bg:    rgba(216,80,58,.08);
    --red-line:  rgba(216,80,58,.2);
    --green:     #4fae7a;
    --green-bg:  rgba(79,174,122,.08);
    --green-line:rgba(79,174,122,.2);
    --amber:     #d9a443;
  }

  html { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--ink); }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
  }

  /* ── LANG TOGGLE ── */
  .lang-bar {
    width: 100%;
    max-width: 560px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 36px;
  }
  .brand { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--mut); }
  .lang-toggle { display: flex; background: var(--surface2); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .lang-btn {
    padding: 7px 18px; font-size: 12px; font-weight: 600; letter-spacing: .5px;
    cursor: pointer; border: none; background: transparent; color: var(--mut);
    transition: all .15s;
  }
  .lang-btn.active { background: var(--dim); color: var(--ink); }

  /* ── HEADER ── */
  .header { width: 100%; max-width: 560px; margin-bottom: 32px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--red); margin-bottom: 12px; }
  .title { font-size: 28px; font-weight: 800; line-height: 1.15; letter-spacing: -.5px; margin-bottom: 10px; }
  .subtitle { font-size: 14px; color: var(--mut); line-height: 1.65; max-width: 460px; }

  /* ── CARD ── */
  .card {
    width: 100%; max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 12px;
  }
  .card-label {
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--mut); margin-bottom: 18px;
  }

  /* ── INPUTS ── */
  .input-grid { display: flex; flex-direction: column; gap: 16px; }
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-label { font-size: 13px; color: var(--mut); }
  .input-wrap { position: relative; }
  .input-prefix {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 15px; font-weight: 600; color: var(--mut);
    font-family: 'JetBrains Mono', monospace;
    pointer-events: none;
  }
  .input-field {
    width: 100%; background: var(--surface2); border: 1px solid var(--line);
    color: var(--ink); border-radius: 10px; padding: 13px 14px 13px 32px;
    font-size: 17px; font-weight: 600; font-family: 'JetBrains Mono', monospace;
    transition: border-color .15s; appearance: none;
  }
  .input-field:focus { outline: none; border-color: var(--dim); }
  .input-field::placeholder { color: var(--dim); font-weight: 400; }

  /* ── LIVE METER ── */
  .meter-card {
    width: 100%; max-width: 560px;
    background: var(--red-bg);
    border: 1px solid var(--red-line);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 12px;
    display: none;
  }
  .meter-card.visible { display: block; }
  .meter-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--red); margin-bottom: 6px; }
  .meter-sub { font-size: 13px; color: var(--mut); margin-bottom: 20px; line-height: 1.5; }
  .meter-num {
    font-size: 52px; font-weight: 800; letter-spacing: -2px; color: var(--red);
    font-family: 'JetBrains Mono', monospace; line-height: 1;
    margin-bottom: 4px;
    transition: opacity .1s;
  }
  .meter-caption { font-size: 12px; color: var(--mut); margin-bottom: 24px; }

  /* ── BREAKDOWN TABLE ── */
  .breakdown { margin-top: 4px; }
  .bk-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line); gap: 12px;
  }
  .bk-row:last-child { border-bottom: none; }
  .bk-label { font-size: 13px; color: #cfd4dc; flex: 1; line-height: 1.4; }
  .bk-val { font-size: 13px; font-weight: 700; color: var(--red); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
  .bk-row.total .bk-label { font-weight: 700; color: var(--ink); }
  .bk-row.total .bk-val { font-size: 16px; color: var(--red); }
  .bk-divider { border-top: 1px solid rgba(255,255,255,.1); margin: 4px 0; }

  /* ── SCENARIOS ── */
  .scenarios {
    width: 100%; max-width: 560px;
    display: none; flex-direction: column; gap: 12px; margin-bottom: 12px;
  }
  .scenarios.visible { display: flex; }
  .scenario-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px;
  }
  .sc-head { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--mut); margin-bottom: 14px; }
  .sc-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--line); gap: 12px;
  }
  .sc-row:last-child { border-bottom: none; }
  .sc-label { font-size: 13px; color: #cfd4dc; flex: 1; line-height: 1.4; }
  .sc-val { font-size: 13px; font-weight: 700; font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
  .sc-val.neg { color: var(--red); }
  .sc-val.pos { color: var(--green); }
  .sc-val.warn { color: var(--amber); }

  /* ── REVENUE AT RISK ── */
  .rev-card {
    width: 100%; max-width: 560px;
    background: rgba(217,164,67,.07);
    border: 1px solid rgba(217,164,67,.2);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 12px;
    display: none;
  }
  .rev-card.visible { display: block; }
  .rev-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--amber); margin-bottom: 6px; }
  .rev-sub { font-size: 13px; color: var(--mut); margin-bottom: 20px; line-height: 1.5; }
  .perf-slider-wrap { margin-bottom: 20px; }
  .perf-slider-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .perf-slider-label { font-size: 13px; color: #cfd4dc; }
  .perf-slider-val { font-size: 15px; font-weight: 700; color: var(--amber); font-family: 'JetBrains Mono', monospace; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 4px;
    background: linear-gradient(to right, var(--amber) 0%, var(--amber) var(--pct, 40%), var(--dim) var(--pct, 40%), var(--dim) 100%);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px;
    border-radius: 50%; background: var(--amber);
    border: 3px solid var(--bg); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--amber); border: 3px solid var(--bg); cursor: pointer;
  }
  .rv-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; border-bottom: 1px solid rgba(217,164,67,.12); gap: 12px;
  }
  .rv-row:last-child { border-bottom: none; }
  .rv-label-t { font-size: 13px; color: #cfd4dc; flex: 1; line-height: 1.4; }
  .rv-val { font-size: 13px; font-weight: 700; color: var(--amber); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
  .rv-val.big { font-size: 16px; color: var(--red); }
  .rv-section-head { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mut); margin: 16px 0 8px; }
  .rv-divider { border-top: 1px solid rgba(217,164,67,.15); margin: 12px 0; }
  .rv-total-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; background: rgba(216,80,58,.08);
    border: 1px solid rgba(216,80,58,.2); border-radius: 10px; margin-top: 12px; gap: 12px;
  }
  .rv-total-label { font-size: 14px; font-weight: 700; color: var(--ink); }
  .rv-total-val { font-size: 18px; font-weight: 800; color: var(--red); font-family: 'JetBrains Mono', monospace; }
  .saving-card {
    width: 100%; max-width: 560px;
    background: var(--green-bg);
    border: 1px solid var(--green-line);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 12px;
    display: none;
  }
  .saving-card.visible { display: block; }
  .saving-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--green); margin-bottom: 6px; }
  .saving-sub { font-size: 13px; color: var(--mut); margin-bottom: 18px; line-height: 1.5; }
  .saving-rows { display: flex; flex-direction: column; gap: 0; }
  .sv-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--green-line); gap: 12px;
  }
  .sv-row:last-child { border-bottom: none; }
  .sv-label { font-size: 13px; color: #cfd4dc; flex: 1; line-height: 1.4; }
  .sv-val { font-size: 14px; font-weight: 700; color: var(--green); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
  .saving-highlight {
    margin-top: 18px; padding: 14px; border-radius: 10px;
    background: rgba(79,174,122,.1); border: 1px solid var(--green-line);
    font-size: 14px; line-height: 1.6; color: #cfd4dc;
  }
  .saving-highlight b { color: var(--green); }

  /* ── CTA ── */
  .cta-card {
    width: 100%; max-width: 560px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 22px;
    display: flex; flex-direction: column; gap: 12px;
    margin-bottom: 12px;
  }
  .cta-head { font-size: 16px; font-weight: 700; }
  .cta-body { font-size: 13px; color: var(--mut); line-height: 1.6; }
  .cta-btn {
    display: block; width: 100%; padding: 15px;
    background: var(--red); color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    text-align: center; text-decoration: none;
    transition: opacity .15s;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .cta-btn:hover { opacity: .88; }

  /* ── FOOTNOTE ── */
  .footnote {
    width: 100%; max-width: 560px;
    font-size: 11px; color: var(--mut); line-height: 1.6;
    margin-top: 8px; opacity: .6;
  }

  /* ── INTEL CALLOUTS ── */
  .intel {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 12px; margin-top: 14px;
    background: rgba(255,255,255,.025); border-left: 2px solid var(--dim);
    border-radius: 0 6px 6px 0;
  }
  .intel-icon { font-size: 11px; color: var(--mut); margin-top: 1px; flex-shrink: 0; }
  .intel-text { font-size: 11px; color: var(--mut); line-height: 1.55; }
  .intel-text b { color: #a0a8b4; }
  .intel-text .intel-src { opacity: .5; }

  /* ── PRESSURE SIGNALS ── */
  .signals-card {
    width: 100%; max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 12px;
    display: none;
  }
  .signals-card.visible { display: block; }
  .signals-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--mut); margin-bottom: 6px; }
  .signals-sub { font-size: 13px; color: var(--mut); line-height: 1.55; margin-bottom: 18px; }
  .signal-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
    cursor: pointer; user-select: none;
  }
  .signal-row:last-of-type { border-bottom: none; }
  .signal-toggle {
    width: 36px; height: 20px; border-radius: 12px;
    background: var(--dim); position: relative;
    transition: background .2s; flex-shrink: 0; margin-top: 1px;
  }
  .signal-toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--mut); transition: all .2s;
  }
  .signal-row.active .signal-toggle { background: var(--red); }
  .signal-row.active .signal-toggle::after { left: 18px; background: #fff; }
  .signal-content { flex: 1; }
  .signal-title { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.35; margin-bottom: 3px; }
  .signal-desc { font-size: 12px; color: var(--mut); line-height: 1.5; }
  .signal-row.active .signal-title { color: var(--red); }
  .signals-summary {
    margin-top: 16px; padding: 14px;
    border-radius: 10px; font-size: 13px; line-height: 1.6; color: #cfd4dc;
    display: none;
  }
  .signals-summary.visible { display: block; }
  .signals-summary b { color: var(--red); }
  .signals-summary.level-low { background: rgba(79,174,122,.06); border: 1px solid rgba(79,174,122,.15); }
  .signals-summary.level-low b { color: var(--green); }
  .signals-summary.level-mid { background: rgba(217,164,67,.06); border: 1px solid rgba(217,164,67,.15); }
  .signals-summary.level-mid b { color: var(--amber); }
  .signals-summary.level-high { background: rgba(216,80,58,.06); border: 1px solid rgba(216,80,58,.15); }
  .signals-summary.level-high b { color: var(--red); }

  @media (max-width: 400px) {
    .meter-num { font-size: 38px; }
    .title { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="lang-bar">
  <div class="brand">Pressure Calibration</div>
  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('es')">ES</button>
  </div>
</div>

<div class="header">
  <div class="eyebrow" data-t="eyebrow"></div>
  <div class="title" data-t="title"></div>
  <div class="subtitle" data-t="subtitle"></div>
</div>

<!-- INPUTS -->
<div class="card">
  <div class="card-label" data-t="inputsLabel"></div>
  <div class="input-grid">
    <div class="input-group">
      <label class="input-label" data-t="salaryLabel"></label>
      <div class="input-wrap">
        <span class="input-prefix" id="currency-prefix">£</span>
        <input class="input-field" id="salary" type="number" min="0" step="1000" data-ph="salaryPh" />
      </div>
    </div>
    <div class="input-group">
      <label class="input-label" data-t="headcountLabel"></label>
      <div class="input-wrap">
        <input class="input-field" id="headcount" type="number" min="1" step="1" style="padding-left:14px" data-ph="headcountPh" />
      </div>
    </div>
    <div class="input-group">
      <label class="input-label" data-t="dealSizeLabel"></label>
      <div class="input-wrap">
        <span class="input-prefix" id="currency-prefix-2">£</span>
        <input class="input-field" id="deal-size" type="number" min="0" step="1000" data-ph="dealSizePh" />
      </div>
    </div>
    <div class="input-group">
      <label class="input-label" data-t="dealsPerYearLabel"></label>
      <div class="input-wrap">
        <input class="input-field" id="deals-per-year" type="number" min="1" max="50" step="1" style="padding-left:14px" data-ph="dealsPerYearPh" />
      </div>
    </div>
    <div class="input-group">
      <label class="input-label" data-t="rampLabel"></label>
      <div class="input-wrap">
        <input class="input-field" id="ramp-months" type="number" min="1" max="18" step="1" style="padding-left:14px" data-ph="rampPh" />
      </div>
    </div>
  </div>
</div>

<!-- LIVE METER -->
<div class="meter-card" id="meter-card">
  <div class="meter-label" data-t="meterLabel"></div>
  <div class="meter-sub" data-t="meterSub"></div>
  <div class="meter-num" id="meter-num">£0</div>
  <div class="meter-caption" data-t="meterCaption"></div>
  <div class="breakdown">
    <div class="bk-row">
      <span class="bk-label" data-t="bkReplace"></span>
      <span class="bk-val" id="bk-replace">—</span>
    </div>
    <div class="bk-row">
      <span class="bk-label" data-t="bkRamp"></span>
      <span class="bk-val" id="bk-ramp">—</span>
    </div>
    <div class="bk-row">
      <span class="bk-label" data-t="bkMgmt"></span>
      <span class="bk-val" id="bk-mgmt">—</span>
    </div>
    <div class="bk-divider"></div>
    <div class="bk-row total">
      <span class="bk-label" data-t="bkTotal"></span>
      <span class="bk-val" id="bk-total">—</span>
    </div>
  </div>
  <div class="intel">
    <span class="intel-icon">▸</span>
    <span class="intel-text" data-t="intelHero"></span>
  </div>
</div>

<!-- SCENARIOS -->
<div class="scenarios" id="scenarios">
  <div class="scenario-card">
    <div class="sc-head" data-t="scHead2"></div>
    <div class="sc-row">
      <span class="sc-label" data-t="scTwo"></span>
      <span class="sc-val neg" id="sc-two">—</span>
    </div>
    <div class="sc-row">
      <span class="sc-label" id="sc-risk-label" data-t="scRisk"></span>
      <span class="sc-val warn" id="sc-risk">—</span>
    </div>
    <div class="sc-row">
      <span class="sc-label" data-t="scTurnover"></span>
      <span class="sc-val warn" id="sc-turnover">—</span>
    </div>
    <div class="intel">
      <span class="intel-icon">▸</span>
      <span class="intel-text" data-t="intelTurnover"></span>
    </div>
  </div>
</div>

<!-- PRESSURE SIGNALS -->
<div class="signals-card" id="signals-card">
  <div class="signals-label" data-t="sigLabel"></div>
  <div class="signals-sub" data-t="sigSub"></div>

  <div class="signal-row" data-sig="sick">
    <div class="signal-toggle"></div>
    <div class="signal-content">
      <div class="signal-title" data-t="sig1Title"></div>
      <div class="signal-desc" data-t="sig1Desc"></div>
    </div>
  </div>

  <div class="signal-row" data-sig="activity">
    <div class="signal-toggle"></div>
    <div class="signal-content">
      <div class="signal-title" data-t="sig2Title"></div>
      <div class="signal-desc" data-t="sig2Desc"></div>
    </div>
  </div>

  <div class="signal-row" data-sig="weekday">
    <div class="signal-toggle"></div>
    <div class="signal-content">
      <div class="signal-title" data-t="sig3Title"></div>
      <div class="signal-desc" data-t="sig3Desc"></div>
    </div>
  </div>

  <div class="signal-row" data-sig="recovery">
    <div class="signal-toggle"></div>
    <div class="signal-content">
      <div class="signal-title" data-t="sig4Title"></div>
      <div class="signal-desc" data-t="sig4Desc"></div>
    </div>
  </div>

  <div class="signal-row" data-sig="discount">
    <div class="signal-toggle"></div>
    <div class="signal-content">
      <div class="signal-title" data-t="sig5Title"></div>
      <div class="signal-desc" data-t="sig5Desc"></div>
    </div>
  </div>

  <div class="signal-row" data-sig="cycle">
    <div class="signal-toggle"></div>
    <div class="signal-content">
      <div class="signal-title" data-t="sig6Title"></div>
      <div class="signal-desc" data-t="sig6Desc"></div>
    </div>
  </div>

  <div class="signals-summary" id="signals-summary"></div>
</div>

<!-- REVENUE AT RISK -->
<div class="rev-card" id="rev-card">
  <div class="rev-label" data-t="revLabel"></div>
  <div class="rev-sub" data-t="revSub"></div>

  <div class="perf-slider-wrap">
    <div class="perf-slider-top">
      <span class="perf-slider-label" data-t="sliderLabel"></span>
      <span class="perf-slider-val" id="perf-pct-display">85%</span>
    </div>
    <input type="range" id="perf-slider" min="70" max="98" value="85" step="1" />
    <div style="display:flex;justify-content:space-between;margin-top:5px;">
      <span style="font-size:11px;color:var(--mut)" data-t="sliderLow"></span>
      <span style="font-size:11px;color:var(--mut)" data-t="sliderHigh"></span>
    </div>
    <div class="intel" style="margin-top:10px; border-left-color: var(--amber);">
      <span class="intel-icon">▸</span>
      <span class="intel-text" data-t="intelDecision"></span>
    </div>
  </div>

  <div class="rv-section-head" data-t="revScenA"></div>
  <div class="rv-row">
    <span class="rv-label-t" data-t="revDealsYear"></span>
    <span class="rv-val" id="rv-deals-year">—</span>
  </div>
  <div class="rv-row">
    <span class="rv-label-t" data-t="revDealsLost"></span>
    <span class="rv-val" id="rv-deals-lost">—</span>

var lang = "en";

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll(".lang-btn").forEach(function(b){
    b.classList.toggle("active", b.textContent === l.toUpperCase());
  });
  applyTranslations();
  updateSignalsSummary();
  calc();
}

function applyTranslations() {
  var t = T[lang];
  document.querySelectorAll("[data-t]").forEach(function(el){
    var key = el.getAttribute("data-t");
    if (t[key] !== undefined) {
      if (key.indexOf("intel") === 0) {
        el.innerHTML = t[key];
      } else {
        el.textContent = t[key];
      }
    }
  });
  document.querySelectorAll("[data-ph]").forEach(function(el){
    var key = el.getAttribute("data-ph");
    if (t[key] !== undefined) el.placeholder = t[key];
  });
  document.getElementById("currency-prefix").textContent = t.currency;
  document.getElementById("currency-prefix-2").textContent = t.currency;
}

// ─── CALCULATOR ───────────────────────────────────────────────────────────────
var PROG_TEAM  = 20000;  // team rate: up to 10 people, 6-week programme
var PROG_PER   = 2000;   // per-person rate

function fmt(n) {
  var t = T[lang];
  if (t.locale === "es-ES") {
    return t.currency + Math.round(n).toLocaleString("es-ES");
  }
  return t.currency + Math.round(n).toLocaleString("en-GB");
}

var animFrame = null;
var displayedVal = 0;

function animateTo(target) {
  if (animFrame) cancelAnimationFrame(animFrame);
  var start = displayedVal;
  var startTime = null;
  var duration = 400;
  function step(ts) {
    if (!startTime) startTime = ts;
    var progress = Math.min((ts - startTime) / duration, 1);
    var ease = 1 - Math.pow(1 - progress, 3);
    displayedVal = start + (target - start) * ease;
    document.getElementById("meter-num").textContent = fmt(displayedVal);
    if (progress < 1) animFrame = requestAnimationFrame(step);
    else displayedVal = target;
  }
  requestAnimationFrame(step);
}

function calc() {
  var salary       = parseFloat(document.getElementById("salary").value);
  var headcount    = parseFloat(document.getElementById("headcount").value);
  var dealSize     = parseFloat(document.getElementById("deal-size").value);
  var dealsPerYear = parseFloat(document.getElementById("deals-per-year").value);
  var rampMonths   = parseFloat(document.getElementById("ramp-months").value);
  var perfPct      = parseFloat(document.getElementById("perf-slider").value) / 100;

  var meterCard  = document.getElementById("meter-card");
  var scenarios  = document.getElementById("scenarios");
  var revCard    = document.getElementById("rev-card");
  var savingCard = document.getElementById("saving-card");
  var sigCard    = document.getElementById("signals-card");

  var hasBase    = salary && salary >= 5000 && headcount && headcount >= 1;
  var hasRevenue = dealSize && dealSize > 0 && dealsPerYear && dealsPerYear > 0;
  var hasRamp    = rampMonths && rampMonths > 0;

  if (!hasBase) {
    meterCard.classList.remove("visible");
    scenarios.classList.remove("visible");
    revCard.classList.remove("visible");
    savingCard.classList.remove("visible");
    sigCard.classList.remove("visible");
    return;
  }

  // ── PEOPLE COST ──────────────────────────────────────────────────────────
  var userRamp = hasRamp ? rampMonths : 7;
  var replace  = salary * 1.5;
  var rampCost = salary * (userRamp / 12) * 0.5;  // 50% productivity over user's ramp period
  var mgmt     = salary * 0.1;
  var total1   = replace + rampCost + mgmt;
  var total2   = total1 * 2;
  var atRisk   = Math.max(1, Math.round(headcount * 0.25));
  var turnover = atRisk * total1;

  meterCard.classList.add("visible");
  animateTo(total1);
  document.getElementById("bk-replace").textContent = fmt(replace);
  document.getElementById("bk-ramp").textContent    = fmt(rampCost);
  document.getElementById("bk-mgmt").textContent    = fmt(mgmt);
  document.getElementById("bk-total").textContent   = fmt(total1);

  scenarios.classList.add("visible");
  sigCard.classList.add("visible");
  document.getElementById("sc-two").textContent      = fmt(total2);
  document.getElementById("sc-risk").textContent     = atRisk + (lang === "es" ? " personas" : " people");
  document.getElementById("sc-turnover").textContent = fmt(turnover);

  // ── PIPELINE IMPACT ──────────────────────────────────────────────────────
  if (hasRevenue) {
    revCard.classList.add("visible");

    // Scenario A: performance gap across team
    var perfGap        = 1 - perfPct;
    var dealsLostPerP  = dealsPerYear * perfGap;
    var revLostPerP    = dealsLostPerP * dealSize;
    var revLostTeam    = revLostPerP * headcount;

    // Scenario B: vacant seat during ramp
    var rampM            = hasRamp ? userRamp : 7;
    var rampFraction     = rampM / 12;
    var rampDealsMissed  = dealsPerYear * rampFraction * 0.5;  // 50% productivity
    var rampRevMissed    = rampDealsMissed * dealSize;

    var totalRevAtRisk = revLostTeam + rampRevMissed;

    document.getElementById("rv-deals-year").textContent  = dealsPerYear + (lang === "es" ? " tratos/persona" : " deals/person");
    document.getElementById("rv-deals-lost").textContent  = dealsLostPerP.toFixed(1) + (lang === "es" ? " tratos/persona" : " deals/person");
    document.getElementById("rv-rev-lost").textContent    = fmt(revLostTeam);
    document.getElementById("rv-ramp-delay").textContent  = rampM + (lang === "es" ? " meses al 50%" : " months at 50%");
    document.getElementById("rv-ramp-deals").textContent  = rampDealsMissed.toFixed(1) + (lang === "es" ? " tratos" : " deals");
    document.getElementById("rv-ramp-rev").textContent    = fmt(rampRevMissed);
    document.getElementById("rv-total").textContent       = fmt(totalRevAtRisk);

    // Saving with combined total
    var roi1       = total1 - PROG_TEAM;
    var roi2       = total2 - PROG_TEAM;
    var roiPct     = Math.round((roi1 / PROG_TEAM) * 100);
    var combined   = total1 + totalRevAtRisk;

    savingCard.classList.add("visible");
    document.getElementById("sv-team-cost").textContent = fmt(PROG_TEAM);
    document.getElementById("sv-per-cost").textContent  = fmt(PROG_PER) + (lang === "es" ? " / persona" : " / person");
    document.getElementById("sv-one").textContent = fmt(roi1);
    document.getElementById("sv-two").textContent = fmt(roi2);
    document.getElementById("sv-roi").textContent = roiPct + "×";

    var t = T[lang];
    var highlight = lang === "en"
      ? "The <b>" + t.prog + "</b> costs <b>" + fmt(PROG_TEAM) + "</b> for up to 10 people. Preventing one exit saves <b>" + fmt(roi1) + "</b> in people costs. The pipeline impact adds another <b>" + fmt(totalRevAtRisk) + "</b> in revenue at risk. Total exposure: <b>" + fmt(combined) + "</b>."
      : "El <b>" + t.prog + "</b> cuesta <b>" + fmt(PROG_TEAM) + "</b> para hasta 10 personas. Evitar una salida ahorra <b>" + fmt(roi1) + "</b> en costes de personal. El impacto en pipeline suma otros <b>" + fmt(totalRevAtRisk) + "</b> en ingresos en riesgo. Exposición total: <b>" + fmt(combined) + "</b>.";
    document.getElementById("saving-highlight").innerHTML = highlight;

  } else {
    revCard.classList.remove("visible");
    var roi1   = total1 - PROG_TEAM;
    var roi2   = total2 - PROG_TEAM;
    var roiPct = Math.round((roi1 / PROG_TEAM) * 100);

    savingCard.classList.add("visible");
    document.getElementById("sv-team-cost").textContent = fmt(PROG_TEAM);
    document.getElementById("sv-per-cost").textContent  = fmt(PROG_PER) + (lang === "es" ? " / persona" : " / person");
    document.getElementById("sv-one").textContent = fmt(roi1);
    document.getElementById("sv-two").textContent = fmt(roi2);
    document.getElementById("sv-roi").textContent = roiPct + "×";

    var t = T[lang];
    var highlight = lang === "en"
      ? "The <b>" + t.prog + "</b> costs <b>" + fmt(PROG_TEAM) + "</b> for up to 10 people. If it prevents one exit, the net saving is <b>" + fmt(roi1) + "</b>. Add your deal size and deals per person above to see the full pipeline impact."
      : "El <b>" + t.prog + "</b> cuesta <b>" + fmt(PROG_TEAM) + "</b> para hasta 10 personas. Si evita una salida, el ahorro neto es de <b>" + fmt(roi1) + "</b>. Introduce el tamaño del trato y los tratos por persona arriba para ver el impacto completo en pipeline.";
    document.getElementById("saving-highlight").innerHTML = highlight;
  }
}

document.querySelectorAll(".signal-row").forEach(function(row) {
  row.addEventListener("click", function() {
    row.classList.toggle("active");
    updateSignalsSummary();
  });
});

function updateSignalsSummary() {
  var count = document.querySelectorAll(".signal-row.active").length;
  var summary = document.getElementById("signals-summary");
  var texts = SIGNAL_SUMMARIES[lang];

  if (count === 0) {
    summary.classList.remove("visible");
    summary.className = "signals-summary";
    return;
  }

  summary.innerHTML = texts[count];
  summary.className = "signals-summary visible";
  if (count <= 2) summary.classList.add("level-low");
  else if (count <= 4) summary.classList.add("level-mid");
  else summary.classList.add("level-high");
}
